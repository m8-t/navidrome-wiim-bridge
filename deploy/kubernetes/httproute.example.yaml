# Needed when a web page served over HTTPS calls the bridge: it may only
# reach the bridge over HTTPS. Not part of the kustomization.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wiim-bridge
  labels:
    app.kubernetes.io/name: wiim-bridge
spec:
  parentRefs:
    - name: my-gateway
      namespace: gateway-system
  hostnames:
    - bridge.example.org
  rules:
    - backendRefs:
        - name: wiim-bridge
          port: 8098
