apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiim-bridge
  labels:
    app.kubernetes.io/name: wiim-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wiim-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiim-bridge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wiim-bridge
          image: ghcr.io/m8-t/navidrome-wiim-bridge:0.7.0
          envFrom:
            - configMapRef:
                name: wiim-bridge
            - secretRef:
                name: wiim-bridge
          ports:
            - name: http
              containerPort: 8098
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
