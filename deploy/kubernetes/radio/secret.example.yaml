# Example only. Do not commit real values.
# Equivalent command:
#   kubectl create secret generic wiim-bridge-radio \
#     --from-literal=BRIDGE_RADIO_TOKEN="$(openssl rand -hex 16)" \
#     --from-literal=ICECAST_SOURCE_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=ICECAST_ADMIN_PASSWORD="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: wiim-bridge-radio
  labels:
    app.kubernetes.io/name: wiim-bridge
type: Opaque
stringData:
  # Shared between the bridge and Liquidsoap.
  BRIDGE_RADIO_TOKEN: change-me-to-a-random-string
  # Liquidsoap logs in to Icecast with this.
  ICECAST_SOURCE_PASSWORD: change-me-too
  ICECAST_ADMIN_PASSWORD: and-me
