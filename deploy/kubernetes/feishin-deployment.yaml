apiVersion: apps/v1
kind: Deployment
metadata:
  name: feishin
  labels:
    app.kubernetes.io/name: feishin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feishin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feishin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feishin
          image: ghcr.io/m8-t/feishin-jukebox:1.17.0-jukebox
          envFrom:
            - configMapRef:
                name: feishin
          ports:
            - name: http
              containerPort: 9180
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          # Not read-only: the entrypoint writes its nginx config and
          # settings.js into /etc/nginx/conf.d at start.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
