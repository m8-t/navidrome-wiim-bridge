apiVersion: v1
kind: ConfigMap
metadata:
  name: wiim-bridge
  labels:
    app.kubernetes.io/name: wiim-bridge
data:
  # Must equal the fixed LoadBalancer address set in service.yaml.
  BRIDGE_ADVERTISE_HOST: "192.0.2.50"
  # Port that serves only the audio URLs and /healthz; the amplifier is told to
  # use it, and the LoadBalancer in service.yaml exposes only this port.
  BRIDGE_DEVICE_PORT: "8099"
  # IP address of the WiiM amplifier.
  BRIDGE_DEVICE_HOST: "192.0.2.60"
  # Navidrome base URL. This is the Service from navidrome-service.yaml.
  BRIDGE_NAVIDROME_URL: "http://navidrome:4533"
  # debug, info, warn or error.
  BRIDGE_LOG_LEVEL: "info"
  # Upper volume limit, 0 to 100.
  # BRIDGE_MAX_VOLUME: "70"
  # Report plays to Navidrome; switch scrobbling off in Feishin then.
  # BRIDGE_SCROBBLE: "true"
