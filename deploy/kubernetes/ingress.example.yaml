# Needed when a web page served over HTTPS calls the bridge: it may only
# reach the bridge over HTTPS. Not part of the kustomization.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiim-bridge
  labels:
    app.kubernetes.io/name: wiim-bridge
spec:
  # ingressClassName: nginx
  tls:
    - hosts:
        - bridge.example.org
      secretName: bridge-example-org-tls
  rules:
    - host: bridge.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiim-bridge
                port:
                  number: 8098
